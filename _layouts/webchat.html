<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>

<!--
  webchat – a chat page for a Hermes Agent API server, with a file explorer
  over this site's assets. One file: markup, styles and a vanilla script.
  Read _webchat/README.md before changing it.

  Jet (the template engine) parses this WHOLE file, the script included.
  Never write two opening curly braces in a row, or an opening curly brace
  followed by a star, anywhere below the data block: the page stops rendering.
-->

<script>
  // CHAT API PREFIX – the one setting of this page.
  // A same-origin proxy serves the Hermes Agent API server's /api/sessions…
  // endpoints under this path, e.g. GET /_system/webchatproxy/api/sessions.
  // Change it here if your proxy lives elsewhere. No trailing slash.
  var WEBCHAT_API_PREFIX = '/_system/webchatproxy'
</script>

<script>
  // Theme before first paint, the same rule as the rest of the site: dark
  // unless the sign-in corner's toggle stored $mol_lights = "true".
  try {
    var dark = localStorage.getItem('$mol_lights') !== 'true'
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  } catch (e) {}
  // Language before first paint. The lang attribute of <html> is the agent's
  // language (the webchatproxy layout command writes it); a visitor's own
  // choice, kept in this browser, wins. The browser's language is never asked.
  try {
    var chosen = localStorage.getItem('webchat_lang')
    if (chosen === 'ru' || chosen === 'en') document.documentElement.lang = chosen
  } catch (e) {}
</script>

{{ defaultTemplate.UserSpaceScripts() }}

<style>
  /* Colours. Change these to restyle the whole page. */
  :root, :root[data-theme="light"] {
    --bg: #f7f7f8; --panel: #ffffff; --line: #e3e3e8; --text: #1d1d22;
    --muted: #6b6b76; --accent: #2f6fed; --accent-text: #ffffff;
    --user: #e9effd; --code: #f0f0f3; --danger: #c62828;
  }
  :root[data-theme="dark"] {
    --bg: #17171b; --panel: #1f1f24; --line: #33333b; --text: #ececf1;
    --muted: #9a9aa6; --accent: #6d9bff; --accent-text: #0d0d10;
    --user: #263352; --code: #2a2a31; --danger: #ff6b6b;
  }

  * { box-sizing: border-box; }
  /* body.webchat, not body: the sign-in corner's stylesheet also colours body. */
  html, body.webchat { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
    border-radius: 8px; padding: 6px 10px; }
  button.primary, a.button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  a.button { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; text-decoration: none; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="search"], textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); padding: 8px 10px; }
  a { color: var(--accent); }

  .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    padding: 0; border-color: transparent; background: none; flex: none; }
  .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round; }
  .only-narrow { display: none; }

  /* Three columns: sessions | chat | files. */
  .app { display: grid; grid-template-columns: 260px 1fr 340px; height: 100vh; height: 100dvh; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0;
    border-right: 1px solid var(--line); background: var(--panel); }
  .pane:last-child { border-right: 0; }
  .pane > header { display: flex; gap: 8px; align-items: center; padding: 10px 12px;
    border-bottom: 1px solid var(--line); min-height: 52px; }
  .pane > header h2 { font-size: 15px; margin: 0; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scroll { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; padding: 8px 12px; white-space: pre-wrap; }
  .signin { position: fixed; top: 8px; right: 12px; z-index: 20; }
  /* Room for the sign-in corner, which sits over the Files header. */
  .files > header { padding-right: 190px; }
  .scrim { display: none; }

  /* Sessions. */
  .session { display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
    border-bottom: 1px solid var(--line); background: none; padding: 10px 12px; }
  .session.active { background: var(--user); }
  .session .title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sessions-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; border-top: 1px solid var(--line); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; border-radius: 0; background: none; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }

  /* Chat. */
  .chat { background: var(--bg); }
  .messages { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 820px; width: 100%; min-width: 0; margin: 0 auto; padding: 10px 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg p { margin: 0 0 8px; white-space: pre-wrap; }
  .msg p:last-child { margin-bottom: 0; }
  .msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 0 0 8px;
    white-space: pre; overflow-wrap: normal; max-width: 100%; }
  .msg code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .msg pre code { padding: 0; background: none; }
  .msg img { max-width: 100%; border-radius: 8px; }
  .table-wrap { overflow-x: auto; margin: 0 0 8px; max-width: 100%; }
  .msg table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top;
    overflow-wrap: normal; }
  .msg th { background: var(--code); font-weight: 600; }
  .tools { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .tools summary { cursor: pointer; display: inline-block; padding: 1px 8px; border: 1px solid var(--line);
    border-radius: 999px; list-style: none; }
  .tools summary::-webkit-details-marker { display: none; }
  .tools[data-live] summary::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .tools ul { margin: 4px 0 0; padding-left: 18px; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .tools[data-live] summary::before { animation: none; } }
  .composer { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  .composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { resize: none; min-height: 44px; max-height: 40vh; max-height: 40dvh; }
  .composer .send { width: 44px; height: 44px; padding: 0; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center; }
  .composer .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }

  .composer [hidden] { display: none !important; }
  .composer .icon-button { width: 44px; height: 44px; }
  .composer.over textarea { border-color: var(--accent); }
  .composer-status { max-width: 820px; margin: 0 auto 6px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; }
  .composer-status:empty { display: none; }
  .composer-status.failed { color: var(--danger); }
  .composer-status.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; flex: none;
    border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .recorder { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .recorder .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none;
    animation: pulse 1s ease-in-out infinite; }
  .recorder .time { font-variant-numeric: tabular-nums; }
  .recorder .grow { flex: 1; color: var(--muted); font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .composer-status.busy::before, .recorder .dot { animation: none; }
  }

  /* Files. */
  .files-tools { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
    border-bottom: 1px solid var(--line); }
  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; }
  .drop.over { border-color: var(--accent); }
  .file { display: block; width: 100%; text-align: left; border: 0; border-radius: 0;
    border-bottom: 1px solid var(--line); background: none; padding: 8px 12px; }
  .file.active { background: var(--user); }
  .file .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview { border-top: 1px solid var(--line); padding: 10px 12px; max-height: 50%; overflow-y: auto; }
  .preview img, .preview video { max-width: 100%; max-height: 260px; display: block; margin: 6px 0; }
  .preview iframe { width: 100%; height: 300px; border: 1px solid var(--line); border-radius: 6px; }
  .preview pre { background: var(--code); padding: 8px; border-radius: 6px; max-height: 260px;
    overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .preview .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; }

  /* Phones, like Telegram: the chat fills the screen with the input at the
     bottom; the chat list slides in from the left, the files from the right. */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; position: relative; overflow: hidden; }
    .only-narrow { display: inline-flex; }
    .sessions, .files { position: fixed; top: 0; bottom: 0; z-index: 30; border: 0;
      visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s;
      box-shadow: 0 0 24px rgba(0, 0, 0, .35); }
    .sessions { left: 0; width: min(86vw, 340px); transform: translateX(-104%); }
    .files { right: 0; width: min(100vw, 420px); transform: translateX(104%); }
    .app[data-tab="sessions"] .sessions, .app[data-tab="files"] .files {
      transform: none; visibility: visible; transition-delay: 0s; }
    .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .45);
      opacity: 0; pointer-events: none; transition: opacity .22s ease; }
    .app[data-tab="sessions"] ~ .scrim, .app[data-tab="files"] ~ .scrim { opacity: 1; pointer-events: auto; }
    .signin { position: static; }
    .files > header { padding-right: 12px; }
    .messages { padding: 12px 10px; }
    .msg { padding: 9px 12px; }
    .composer { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
    .composer textarea { font-size: 16px; }
    .sessions-foot { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  }
  @media (max-width: 860px) and (prefers-reduced-motion: reduce) {
    .sessions, .files, .scrim { transition: none; }
  }
</style>
</head>
<body class="webchat">

<!-- From the server: whether the visitor is the site admin. -->
<script type="application/json" id="webchat-data">
  {{ json(map(
    "isAdmin", currentUser.IsAdmin()
  )) }}
</script>

<div class="app" id="app" data-tab="chat">
  <section class="pane sessions" id="sessions-pane">
    <header>
      <h2 data-i18n="chats">Chats</h2>
      <button class="primary" id="new-chat" data-i18n="newChat">New chat</button>
      <button class="icon-button only-narrow" data-close data-i18n-label="close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="scroll" id="session-list"></div>
    <div class="sessions-foot">
      <div class="lang" role="group" data-i18n-label="language" aria-label="Language">
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="signin"><div mol_view_root="$trip2g_user_space"></div></div>
    </div>
  </section>

  <section class="pane chat">
    <header>
      <button class="icon-button only-narrow" id="open-sessions" data-i18n-label="chats" aria-label="Chats">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="chat-title" data-i18n="chat">Chat</h2>
      <button class="icon-button only-narrow" id="open-files" data-i18n-label="files" aria-label="Files">
        <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
      </button>
    </header>
    <div class="scroll"><div class="messages" id="messages"></div></div>
    <div class="composer" id="composer-box">
      <div class="composer-status" id="composer-status" role="status"></div>
      <div class="recorder" id="recorder" hidden>
        <button type="button" class="icon-button" id="rec-cancel" data-i18n-label="cancel" aria-label="Cancel">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span class="dot"></span>
        <span class="time" id="rec-time">0:00</span>
        <span class="grow" data-i18n="recording">Recording</span>
        <button type="button" class="primary send" id="rec-send" data-i18n-label="send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <form id="composer">
        <button type="button" class="icon-button" id="attach-file" data-i18n-label="attachFile" aria-label="Attach a file">
          <svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
        </button>
        <input type="file" id="composer-file" hidden>
        <textarea id="input" rows="1" data-i18n-placeholder="placeholder" placeholder="Message"></textarea>
        <button type="button" class="primary send" id="mic" hidden data-i18n-label="voice" aria-label="Voice message">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button class="primary send" id="send" type="submit" data-i18n-label="send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </div>
  </section>

  <section class="pane files" id="files-pane">
    <header>
      <h2 data-i18n="files">Files</h2>
      <span class="muted" id="file-count"></span>
      <button class="icon-button only-narrow" data-close data-i18n-label="close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="files-tools">
      <input type="search" id="file-search" data-i18n-placeholder="searchFiles" placeholder="Search files">
      <label class="drop" id="drop">
        <span data-i18n="drop">Drop a file here or choose one</span>
        <input type="file" id="file-input" hidden>
      </label>
      <div class="muted" id="upload-status"></div>
    </div>
    <div class="scroll" id="file-list"></div>
    <div class="pager" id="pager"></div>
    <div class="preview" id="preview" hidden></div>
  </section>
</div>
<div class="scrim" id="scrim"></div>

<script>
(function () {
  'use strict'

  var DATA = JSON.parse(document.getElementById('webchat-data').textContent)
  var CHAT_API = WEBCHAT_API_PREFIX

  // Where uploaded files go. The folder's hidden note uploads/_files.md embeds
  // every uploaded file: trip2g stores a file only when a note refers to it.
  var UPLOAD_FOLDER = 'uploads'
  var CONTAINER_NOTE = UPLOAD_FOLDER + '/_files.md'

  // trip2g's request body limit (--max-request-body-size, 10 MB by default).
  var MAX_UPLOAD_BYTES = 10 * 1024 * 1024

  // Extensions trip2g accepts as a note's file (internal/image/utils.go).
  var UPLOAD_EXTENSIONS = ('apng avif gif jpg jpeg jfif pjpeg pjp png svg webp ' +
    'mp4 avi mov mkv webm m4v mp3 wav ogg flac m4a aac ' +
    'pdf doc docx xls xlsx ppt pptx txt rtf odt ods odp csv zip rar 7z').split(' ')

  var FILES_PER_PAGE = 50
  var TEXT_PREVIEW_BYTES = 200 * 1024

  var $ = function (id) { return document.getElementById(id) }

  // Chats the person never opened on purpose: health checks, scheduled runs,
  // letters. Hidden from the list by id prefix and by source.
  var HIDDEN_SESSION_ID = /^(healthz|cron|letter)[-_]/
  var HIDDEN_SESSION_SOURCES = ['cron']

  // ---------------------------------------------------------------------------
  // Language: Russian or English. The agent's language is the page's lang
  // attribute; the RU/EN switch overrides it and is remembered in this browser.
  // ---------------------------------------------------------------------------

  var LANGUAGES = ['ru', 'en']
  var DEFAULT_LANGUAGE = 'ru'

  var TEXT = {
    ru: {
      chats: 'Чаты', chat: 'Чат', files: 'Файлы', newChat: 'Новый чат', close: 'Закрыть',
      language: 'Язык', send: 'Отправить', placeholder: 'Сообщение',
      searchFiles: 'Поиск файла по имени или папке',
      drop: 'Перетащите файл сюда или выберите',
      you: 'Вы', agent: 'Агент',
      noChats: 'Чатов пока нет.', pickChat: 'Выберите чат или начните новый.',
      signInMessage: 'Войдите в чат, чтобы читать и отправлять сообщения.', signIn: 'Войти',
      unavailable: 'Чат сейчас недоступен (HTTP %s). Попробуйте через минуту.',
      apiError: 'Ошибка чата %s: %s',
      working: 'Работаю…', usedTools: 'Использовано инструментов: %s', workingTools: 'Работаю… (%s)',
      adminOnly: 'Файлы доступны администратору сайта. Войдите кнопкой в углу.',
      noFiles: 'Файлов нет.', fileOne: 'файл', fileFew: 'файла', fileMany: 'файлов',
      back: 'Назад', next: 'Далее', usedIn: 'Используется в: ', loading: 'Загрузка…',
      attach: 'Прикрепить к сообщению', download: 'Скачать',
      uploadBadExt: 'trip2g не хранит файлы .%s. Допустимые: %s',
      uploadTooBig: '%s весит %s, предел %s.',
      uploading: 'Загружаю %s…', uploaded: 'Загружено %s',
      uploadFailed: 'Не удалось загрузить: %s',
      conflict: 'Кто-то изменил %s одновременно. Попробуйте ещё раз.',
      attachFile: 'Прикрепить файл', voice: 'Голосовое сообщение', cancel: 'Отмена', recording: 'Идёт запись',
      transcribing: 'Распознаю речь…', micDenied: 'Нет доступа к микрофону.',
      voiceFailed: 'Не удалось распознать речь: %s', voiceEmpty: 'Речь не распознана.',
      voiceTooBig: 'Запись весит %s, предел %s.',
    },
    en: {
      chats: 'Chats', chat: 'Chat', files: 'Files', newChat: 'New chat', close: 'Close',
      language: 'Language', send: 'Send', placeholder: 'Message',
      searchFiles: 'Search files by name or folder',
      drop: 'Drop a file here or choose one',
      you: 'You', agent: 'Agent',
      noChats: 'No chats yet.', pickChat: 'Pick a chat or start a new one.',
      signInMessage: 'Sign in to the chat to see and send messages.', signIn: 'Sign in',
      unavailable: 'The chat is not available right now (HTTP %s). Try again in a minute.',
      apiError: 'Chat API %s: %s',
      working: 'Working…', usedTools: 'Tools used: %s', workingTools: 'Working… (%s)',
      adminOnly: 'Files are for the site admin. Sign in with the button in the corner.',
      noFiles: 'No files.', fileOne: 'file', fileFew: 'files', fileMany: 'files',
      back: 'Back', next: 'Next', usedIn: 'Used in: ', loading: 'Loading…',
      attach: 'Attach to message', download: 'Download',
      uploadBadExt: 'trip2g does not store .%s files. Allowed: %s',
      uploadTooBig: '%s is %s; the limit is %s.',
      uploading: 'Uploading %s…', uploaded: 'Uploaded %s',
      uploadFailed: 'Upload failed: %s',
      conflict: 'Someone changed %s at the same time. Try again.',
      attachFile: 'Attach a file', voice: 'Voice message', cancel: 'Cancel', recording: 'Recording',
      transcribing: 'Transcribing…', micDenied: 'Microphone access was denied.',
      voiceFailed: 'Could not transcribe: %s', voiceEmpty: 'No speech was recognised.',
      voiceTooBig: 'The recording is %s; the limit is %s.',
    },
  }

  function currentLanguage() {
    var lang = document.documentElement.lang
    return LANGUAGES.includes(lang) ? lang : DEFAULT_LANGUAGE
  }

  // t('usedTools', 3): each %s takes the next argument.
  function t(key) {
    var args = Array.prototype.slice.call(arguments, 1)
    return TEXT[currentLanguage()][key].replace(/%s/g, function () { return args.shift() })
  }

  function applyLanguage() {
    var lang = currentLanguage()
    document.documentElement.lang = lang
    document.querySelectorAll('[data-i18n]').forEach(function (node) { node.textContent = t(node.dataset.i18n) })
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (node) { node.placeholder = t(node.dataset.i18nPlaceholder) })
    document.querySelectorAll('[data-i18n-label]').forEach(function (node) { node.setAttribute('aria-label', t(node.dataset.i18nLabel)) })
    document.querySelectorAll('[data-lang]').forEach(function (node) { node.setAttribute('aria-pressed', String(node.dataset.lang === lang)) })
    if (!state.sessionId) $('chat-title').textContent = t('chat')
  }

  function chooseLanguage(lang) {
    document.documentElement.lang = lang
    try { localStorage.setItem('webchat_lang', lang) } catch (e) {}
    applyLanguage()
    loadSessions()
    if (!state.sessionId) loadMessages()
    loadFiles()
  }

  // Small DOM helper: el('p', {class: 'x'}, 'text', childNode). Text is always
  // set as text, never as HTML, so nothing from the agent or a file name can
  // inject markup into the page.
  function el(tag, attrs, ...children) {
    var node = document.createElement(tag)
    Object.entries(attrs || {}).forEach(function ([key, value]) {
      if (value === undefined || value === null || value === false) return
      if (key === 'onclick') node.addEventListener('click', value)
      else node.setAttribute(key, value === true ? '' : value)
    })
    children.flat(Infinity).forEach(function (child) {
      if (child === null || child === undefined || child === false) return
      node.append(child instanceof Node ? child : String(child))
    })
    return node
  }

  function formatSize(bytes) {
    var ru = currentLanguage() === 'ru'
    if (bytes < 1024) return bytes + (ru ? ' Б' : ' B')
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + (ru ? ' КБ' : ' KB')
    return (bytes / 1024 / 1024).toFixed(1) + (ru ? ' МБ' : ' MB')
  }

  function formatTime(seconds) {
    if (!seconds) return ''
    return new Date(seconds * 1000).toLocaleString(currentLanguage())
  }

  // ---------------------------------------------------------------------------
  // Markdown, safely. Fenced code, inline code, bold, links and images. Links
  // and images only with http(s), a same-site path, or (images) a data:image.
  // ---------------------------------------------------------------------------

  function safeHref(url) {
    if (/^https?:\/\//i.test(url)) return url
    if (url.startsWith('/') && !url.startsWith('//')) return url
    return null
  }

  function safeImageSrc(url) {
    if (/^data:image\/(png|jpe?g|gif|webp);/i.test(url)) return url
    return safeHref(url)
  }

  var INLINE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(!?\[[^\]\n]*\]\([^)\s]+\))|(https?:\/\/[^\s<>()]+)/g

  function renderInline(text) {
    var nodes = []
    var last = 0
    text.replace(INLINE, function (match, code, bold, link, bare, offset) {
      if (offset > last) nodes.push(text.slice(last, offset))
      last = offset + match.length
      if (code) { nodes.push(el('code', null, code.slice(1, -1))); return match }
      if (bold) { nodes.push(el('strong', null, bold.slice(2, -2))); return match }
      if (bare) {
        var href = safeHref(bare)
        nodes.push(href ? el('a', { href: href, target: '_blank', rel: 'noopener' }, bare) : bare)
        return match
      }
      var parts = /^(!?)\[([^\]]*)\]\(([^)]+)\)$/.exec(link)
      if (parts[1]) {
        var src = safeImageSrc(parts[3])
        nodes.push(src ? el('img', { src: src, alt: parts[2] }) : match)
      } else {
        var target = safeHref(parts[3])
        nodes.push(target ? el('a', { href: target, target: '_blank', rel: 'noopener' }, parts[2] || parts[3]) : match)
      }
      return match
    })
    if (last < text.length) nodes.push(text.slice(last))
    return nodes
  }

  var TABLE_ROW = /^\s*\|.*\|\s*$/
  var TABLE_RULE = /^\s*\|(\s*:?-+:?\s*\|)+\s*$/

  function tableCells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (cell) { return cell.trim() })
  }

  function tableNode(lines) {
    var aligns = tableCells(lines[1]).map(function (rule) {
      if (rule.startsWith(':') && rule.endsWith(':')) return 'center'
      return rule.endsWith(':') ? 'right' : 'left'
    })
    function row(line, cellTag) {
      return el('tr', null, tableCells(line).map(function (cell, i) {
        return el(cellTag, { style: 'text-align:' + (aligns[i] || 'left') }, renderInline(cell))
      }))
    }
    var body = lines.slice(2).map(function (line) { return row(line, 'td') })
    return el('div', { class: 'table-wrap' }, el('table', null, el('thead', null, row(lines[0], 'th')), el('tbody', null, body)))
  }

  function renderParagraph(para, out) {
    var lines = para.split('\n')
    var text = []
    function flush() {
      if (text.length) out.append(el('p', null, renderInline(text.join('\n'))))
      text = []
    }
    for (var i = 0; i < lines.length; i++) {
      if (TABLE_ROW.test(lines[i]) && i + 1 < lines.length && TABLE_RULE.test(lines[i + 1])) {
        flush()
        var end = i + 2
        while (end < lines.length && TABLE_ROW.test(lines[end])) end++
        out.append(tableNode(lines.slice(i, end)))
        i = end - 1
      } else {
        text.push(lines[i])
      }
    }
    flush()
  }

  function renderMarkdown(text) {
    var out = document.createDocumentFragment()
    var blocks = String(text).split(/^```[^\n]*\n?/m)
    blocks.forEach(function (block, i) {
      if (i % 2 === 1) {
        out.append(el('pre', null, el('code', null, block.replace(/\n$/, ''))))
        return
      }
      block.split(/\n{2,}/).forEach(function (para) {
        if (para.trim()) renderParagraph(para.replace(/^\n+|\n+$/g, ''), out)
      })
    })
    return out
  }

  // Hermes message content is a string, or a list of parts like {type: 'text', text}.
  function contentText(content) {
    if (typeof content === 'string') return content
    if (Array.isArray(content)) {
      return content.map(function (part) {
        if (part.type === 'text') return part.text
        if (part.type === 'image_url') return '![image](' + (part.image_url && part.image_url.url) + ')'
        return ''
      }).join('\n')
    }
    return content ? JSON.stringify(content) : ''
  }

  // ---------------------------------------------------------------------------
  // Chat API: the Hermes Agent API server, reached on this site at CHAT_API
  // through an authenticating proxy. Without a proxy session every call
  // answers 401; the proxy's sign-in page is CHAT_API/oauth2/start?rd=<path>
  // (the oauth2-proxy convention).
  // Formats are Hermes' own: GET /api/sessions -> {data: [session]},
  // GET /api/sessions/{id}/messages -> {data: [message]},
  // POST /api/sessions/{id}/chat/stream -> server-sent events.
  // ---------------------------------------------------------------------------

  function chatFetch(path, options) {
    return fetch(CHAT_API + path, Object.assign({ credentials: 'same-origin' }, options)).then(function (res) {
      var type = res.headers.get('Content-Type') || ''
      if (res.status === 401 || res.redirected || (res.ok && type.includes('text/html'))) {
        var err = new Error(t('signInMessage'))
        err.signIn = true
        throw err
      }
      // 403: the proxy refused the request (e.g. cross-site); 502: the agent is down;
      // 503: the proxy's sign-in backend is down. Signing in fixes none of them.
      if (res.status === 403 || res.status === 502 || res.status === 503) {
        throw new Error(t('unavailable', res.status))
      }
      if (!res.ok) {
        return res.text().then(function (body) { throw new Error(t('apiError', res.status, body.slice(0, 300))) })
      }
      return res
    })
  }

  function chatJSON(path, options) {
    return chatFetch(path, options).then(function (res) { return res.json() })
  }

  var state = { sessionId: null, sending: false, uploading: 0, titles: {} }

  function signInURL() {
    return CHAT_API + '/oauth2/start?rd=' + encodeURIComponent(location.pathname)
  }

  // An error line; for a missing proxy session, a sign-in button with it.
  function errorNode(err) {
    var node = el('div', { class: 'error' }, err.message)
    if (err.signIn) node.append(' ', el('a', { class: 'button primary', href: signInURL() }, t('signIn')))
    return node
  }

  function showChatError(err) {
    $('messages').append(errorNode(err))
  }

  function loadSessions() {
    var list = $('session-list')
    return chatJSON('/api/sessions?limit=100').then(function (body) {
      list.replaceChildren()
      var shown = body.data.filter(function (s) {
        return !HIDDEN_SESSION_ID.test(s.id) && !HIDDEN_SESSION_SOURCES.includes(s.source)
      })
      if (!shown.length) list.append(el('div', { class: 'muted', style: 'padding:12px' }, t('noChats')))
      shown.forEach(function (s) {
        var label = s.title || s.preview || s.id
        state.titles[s.id] = label
        if (s.id === state.sessionId) $('chat-title').textContent = label
        list.append(el('button', {
          class: 'session' + (s.id === state.sessionId ? ' active' : ''),
          onclick: function () { location.hash = encodeURIComponent(s.id); setTab('chat') },
        }, el('span', { class: 'title' }, label), el('span', { class: 'muted' }, formatTime(s.last_active || s.started_at))))
      })
    }).catch(function (err) {
      list.replaceChildren(errorNode(err))
    })
  }

  function messageNode(role, text) {
    var body = el('div', { class: 'body' })
    body.append(renderMarkdown(text))
    var who = role === 'user' ? 'you' : 'agent'
    return el('div', { class: 'msg ' + role }, el('div', { class: 'role', 'data-i18n': who }, t(who)), body)
  }

  function loadMessages() {
    var box = $('messages')
    box.replaceChildren()
    if (!state.sessionId) {
      $('chat-title').textContent = t('chat')
      box.append(el('div', { class: 'muted' }, t('pickChat')))
      return Promise.resolve()
    }
    $('chat-title').textContent = state.titles[state.sessionId] || state.sessionId
    return chatJSON('/api/sessions/' + encodeURIComponent(state.sessionId) + '/messages').then(function (body) {
      body.data.forEach(function (m) {
        if (m.role !== 'user' && m.role !== 'assistant') return
        var text = contentText(m.content)
        if (text.trim()) box.append(messageNode(m.role, text))
      })
      scrollToEnd()
    }).catch(function (err) { showChatError(err) })
  }

  function scrollToEnd() {
    var scroller = $('messages').parentElement
    scroller.scrollTop = scroller.scrollHeight
  }

  function newChat() {
    return chatJSON('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    }).then(function (body) {
      location.hash = encodeURIComponent(body.session.id)
      setTab('chat')
      return loadSessions()
    }).catch(function (err) { showChatError(err) })
  }

  // Reads a server-sent event stream from a fetch response and calls
  // onEvent(name, data) per event. EventSource cannot POST, hence by hand.
  function readEvents(res, onEvent) {
    var reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
    var buffer = ''
    function pump() {
      return reader.read().then(function (chunk) {
        if (chunk.done) return
        buffer += chunk.value
        var frames = buffer.split('\n\n')
        buffer = frames.pop()
        frames.forEach(function (frame) {
          var name = (frame.match(/^event: (.*)$/m) || [])[1]
          var data = (frame.match(/^data: (.*)$/m) || [])[1]
          if (name && data) onEvent(name, JSON.parse(data))
        })
        return pump()
      })
    }
    return pump()
  }

  function send(text) {
    if (state.sending || state.uploading || !text.trim()) return
    if (!state.sessionId) {
      newChat().then(function () { if (state.sessionId) send(text) })
      return
    }
    state.sending = true
    $('input').value = ''
    updateComposer()

    var box = $('messages')
    box.append(messageNode('user', text))
    var reply = messageNode('assistant', '')
    var body = reply.querySelector('.body')
    var toolNames = []
    var toolList = el('ul')
    var toolSummary = el('summary')
    var tools = el('details', { class: 'tools', hidden: true }, toolSummary, toolList)
    reply.insertBefore(tools, body)
    function showTools(live) {
      tools.hidden = !toolNames.length && !live
      if (live) tools.setAttribute('data-live', '')
      else tools.removeAttribute('data-live')
      toolSummary.textContent = live
        ? (toolNames.length ? t('workingTools', toolNames.length) : t('working'))
        : t('usedTools', toolNames.length)
    }
    showTools(true)
    box.append(reply)
    scrollToEnd()

    var answer = ''
    function redraw() { body.replaceChildren(renderMarkdown(answer)); scrollToEnd() }

    // Event names are Hermes': assistant.delta, tool.started, assistant.completed,
    // run.completed, error, done. Anything else is ignored.
    var handlers = {
      'assistant.delta': function (e) { answer += e.delta || ''; redraw() },
      'tool.started': function (e) { toolNames.push(e.tool_name || '?'); toolList.append(el('li', null, e.tool_name || '?')); showTools(true) },
      'assistant.completed': function (e) { if (typeof e.content === 'string' && e.content) answer = e.content; redraw() },
      'error': function (e) { reply.append(el('div', { class: 'error' }, e.message || 'error')) },
    }

    chatFetch('/api/sessions/' + encodeURIComponent(state.sessionId) + '/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
      body: JSON.stringify({ message: text }),
    }).then(function (res) {
      return readEvents(res, function (name, data) { if (handlers[name]) handlers[name](data) })
    }).catch(function (err) {
      reply.append(errorNode(err))
    }).finally(function () {
      showTools(false)
      state.sending = false
      updateComposer()
      loadSessions()
    })
  }

  // ---------------------------------------------------------------------------
  // Files: trip2g's own asset store, through its admin GraphQL on this site.
  // Only the site admin sees this pane; the server refuses everyone else.
  // ---------------------------------------------------------------------------

  function graphql(query, variables) {
    return fetch('/_system/graphql', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, variables: variables }),
    }).then(function (res) { return res.json() }).then(function (body) {
      if (body.errors) throw new Error(body.errors[0].message)
      return body.data
    })
  }

  // A file upload goes as a GraphQL multipart request: operations, map, file.
  function graphqlUpload(query, variables, file) {
    var form = new FormData()
    form.append('operations', JSON.stringify({ query: query, variables: variables }))
    form.append('map', JSON.stringify({ 0: ['variables.input.file'] }))
    form.append('0', file)
    return fetch('/_system/graphql', { method: 'POST', credentials: 'same-origin', body: form })
      .then(function (res) { return res.json() })
      .then(function (body) {
        if (body.errors) throw new Error(body.errors[0].message)
        return body.data
      })
  }

  var LIST_FILES = 'query ($filter: AdminLatestNoteAssetsFilter) { admin { allLatestNoteAssets(filter: $filter) {' +
    ' totalCount nodes { id absolutePath fileName url size createdAt contentType notes { path url } } } } }'

  var READ_NOTE = 'query ($paths: [String!]) { notePaths(filter: { paths: $paths }) { value content latestContentHash } }'

  var PUSH_NOTE = 'mutation ($input: PushNotesInput!) { pushNotes(input: $input) { __typename' +
    ' ... on PushNotesPayload { notes { id path } hashMismatches { path } } ... on ErrorPayload { message } } }'

  var UPLOAD_FILE = 'mutation ($input: UploadNoteAssetInput!) { uploadNoteAsset(input: $input) { __typename' +
    ' ... on UploadNoteAssetPayload { uploadSkipped } ... on ErrorPayload { message } } }'

  var files = { search: '', offset: 0, total: 0, selected: null }

  function loadFiles() {
    if (!DATA.isAdmin) {
      $('file-list').replaceChildren(el('div', { class: 'muted', style: 'padding:12px' },
        t('adminOnly')))
      $('drop').hidden = true
      $('file-search').disabled = true
      return Promise.resolve()
    }
    var filter = { search: files.search || null, limit: FILES_PER_PAGE, offset: files.offset }
    return graphql(LIST_FILES, { filter: filter }).then(function (data) {
      var result = data.admin.allLatestNoteAssets
      files.total = result.totalCount
      $('file-count').textContent = result.totalCount + ' ' + t(fileNoun(result.totalCount))
      var list = $('file-list')
      list.replaceChildren()
      if (!result.nodes.length) list.append(el('div', { class: 'muted', style: 'padding:12px' }, 'No files.'))
      result.nodes.forEach(function (asset) {
        list.append(el('button', {
          class: 'file' + (files.selected && files.selected.id === asset.id ? ' active' : ''),
          onclick: function () { files.selected = asset; showPreview(asset); loadFiles() },
        }, el('span', { class: 'name' }, asset.absolutePath),
          el('span', { class: 'muted' }, asset.contentType + ' · ' + formatSize(asset.size))))
      })
      renderPager()
    }).catch(function (err) {
      $('file-list').replaceChildren(el('div', { class: 'error' }, err.message))
    })
  }

  // Russian takes three forms: 1 файл, 2 файла, 5 файлов; English two.
  function fileNoun(count) {
    var last = count % 10
    var lastTwo = count % 100
    if (last === 1 && lastTwo !== 11) return 'fileOne'
    if (last >= 2 && last <= 4 && (lastTwo < 12 || lastTwo > 14)) return currentLanguage() === 'ru' ? 'fileFew' : 'fileMany'
    return 'fileMany'
  }

  function renderPager() {
    var pager = $('pager')
    pager.replaceChildren()
    if (files.total <= FILES_PER_PAGE) return
    var page = Math.floor(files.offset / FILES_PER_PAGE) + 1
    var pages = Math.ceil(files.total / FILES_PER_PAGE)
    pager.append(
      el('button', { disabled: page === 1, onclick: function () { files.offset -= FILES_PER_PAGE; loadFiles() } }, t('back')),
      el('span', { class: 'muted' }, page + ' / ' + pages),
      el('button', { disabled: page === pages, onclick: function () { files.offset += FILES_PER_PAGE; loadFiles() } }, t('next')))
  }

  function absoluteURL(url) {
    return new URL(url, location.origin).href
  }

  function showPreview(asset) {
    var box = $('preview')
    box.hidden = false
    box.replaceChildren(el('strong', null, asset.fileName),
      el('div', { class: 'muted' }, asset.absolutePath + ' · ' + asset.contentType + ' · ' + formatSize(asset.size)))

    // The type comes from the server's MIME table, which differs between hosts
    // (.webm is audio/webm on some), so video is also recognised by extension.
    var type = asset.contentType
    var isVideo = type.startsWith('video/') || /\.(mp4|webm|mov|m4v|mkv)$/i.test(asset.fileName)
    if (type.startsWith('image/')) box.append(el('img', { src: asset.url, alt: asset.fileName }))
    else if (isVideo) box.append(el('video', { src: asset.url, controls: true, preload: 'metadata' }))
    else if (type.startsWith('audio/')) box.append(el('audio', { src: asset.url, controls: true }))
    else if (type === 'application/pdf') box.append(el('iframe', { src: asset.url, title: asset.fileName }))
    else if (type.startsWith('text/') || type.includes('json')) {
      var pre = el('pre', null, t('loading'))
      box.append(pre)
      fetch(asset.url, { credentials: 'same-origin', headers: { Range: 'bytes=0-' + (TEXT_PREVIEW_BYTES - 1) } })
        .then(function (res) { return res.text() })
        .then(function (text) { pre.textContent = text })
        .catch(function (err) { pre.textContent = err.message })
    }

    if (asset.notes.length) {
      box.append(el('div', { class: 'muted' }, 'Used in: ',
        asset.notes.map(function (n, i) { return [i ? ', ' : '', el('a', { href: n.url, target: '_blank' }, n.path)] })))
    }

    box.append(el('div', { class: 'actions' },
      el('button', { class: 'primary', onclick: function () { attach(asset) } }, t('attach')),
      el('a', { href: asset.url, target: '_blank', download: asset.fileName }, t('download'))))
  }

  // What the agent reads: a link it can fetch and where the file sits in the
  // vault it shares with this site.
  function attachmentText(asset) {
    var used = asset.notes.map(function (n) { return n.path }).join(', ')
    return '[file: ' + asset.fileName + '](' + absoluteURL(asset.url) + ')\n' +
      '(trip2g vault file ' + asset.absolutePath + ', ' + asset.contentType + ', ' + formatSize(asset.size) +
      (used ? ', referenced by ' + used : '') + ')'
  }

  function attach(asset) {
    var input = $('input')
    var before = input.value.slice(0, input.selectionStart)
    var after = input.value.slice(input.selectionEnd)
    var block = (before && !before.endsWith('\n') ? '\n' : '') + attachmentText(asset) + '\n'
    input.value = before + block + after
    input.focus()
    growInput()
    setTab('chat')
  }

  // ---------------------------------------------------------------------------
  // Upload: add the file to the hidden note uploads/_files.md, then send the
  // bytes for that note version. That is how trip2g's own sync uploads files.
  // ---------------------------------------------------------------------------

  function uploadStatus(text, isError) {
    var status = $('upload-status')
    status.textContent = text
    status.className = isError ? 'error' : 'muted'
  }

  function sha256Hex(file) {
    return file.arrayBuffer().then(function (buffer) { return crypto.subtle.digest('SHA-256', buffer) }).then(function (digest) {
      return Array.from(new Uint8Array(digest)).map(function (b) { return b.toString(16).padStart(2, '0') }).join('')
    })
  }

  // Characters a wikilink cannot carry become "_"; a taken name gets -2, -3 …
  function freeName(original, taken) {
    var clean = original.replace(/[\[\]|#^\n\r]/g, '_')
    var dot = clean.lastIndexOf('.')
    var stem = dot > 0 ? clean.slice(0, dot) : clean
    var ext = dot > 0 ? clean.slice(dot) : ''
    var name = clean
    for (var n = 2; taken.has(name.toLowerCase()); n++) name = stem + '-' + n + ext
    return name
  }

  // Stores a file the way trip2g's sync does and resolves to the stored asset,
  // or to null after saying why through report(text, isError).
  function storeFile(file, report) {
    var ext = (file.name.split('.').pop() || '').toLowerCase()
    if (!UPLOAD_EXTENSIONS.includes(ext)) {
      report(t('uploadBadExt', ext, UPLOAD_EXTENSIONS.join(', ')), true)
      return Promise.resolve(null)
    }
    if (file.size > MAX_UPLOAD_BYTES) {
      report(t('uploadTooBig', file.name, formatSize(file.size), formatSize(MAX_UPLOAD_BYTES)), true)
      return Promise.resolve(null)
    }

    report(t('uploading', file.name))
    var prefix = '/' + UPLOAD_FOLDER + '/'
    var name, versionId

    return Promise.all([
      graphql(READ_NOTE, { paths: [CONTAINER_NOTE] }),
      graphql(LIST_FILES, { filter: { pathPrefix: prefix } }),
      sha256Hex(file),
    ]).then(function ([noteData, listData, hash]) {
      var note = noteData.notePaths[0]
      var taken = new Set(listData.admin.allLatestNoteAssets.nodes.map(function (a) { return a.absolutePath.slice(prefix.length).toLowerCase() }))
      name = freeName(file.name, taken)
      var content = note ? note.content.replace(/\n*$/, '\n') : '---\nfree: false\n---\nFiles uploaded from the chat page.\n'
      var push = {
        updates: [{ path: CONTAINER_NOTE, content: content + '![[' + name + ']]\n', expectedHash: note ? note.latestContentHash : '' }],
      }
      return graphql(PUSH_NOTE, { input: push }).then(function (data) {
        var result = data.pushNotes
        if (result.__typename === 'ErrorPayload') throw new Error(result.message)
        if (result.hashMismatches.length) throw new Error(t('conflict', CONTAINER_NOTE))
        // notes lists every note the push touched or re-indexed; take ours.
        versionId = result.notes.find(function (n) { return n.path === CONTAINER_NOTE }).id
        var upload = { file: null, noteId: versionId, sha256Hash: hash, path: name, absolutePath: prefix + name }
        return graphqlUpload(UPLOAD_FILE, { input: upload }, file)
      })
    }).then(function (data) {
      var result = data.uploadNoteAsset
      if (result.__typename === 'ErrorPayload') throw new Error(result.message)
      report(t('uploaded', prefix + name))
      return graphql(LIST_FILES, { filter: { pathPrefix: prefix + name, limit: 1 } })
    }).then(function (data) {
      return data.admin.allLatestNoteAssets.nodes[0] || null
    }).catch(function (err) {
      report(t('uploadFailed', err.message), true)
      return null
    })
  }

  function uploadFile(file) {
    return storeFile(file, uploadStatus).then(function (asset) {
      if (!asset) return
      files.search = ''
      files.offset = 0
      $('file-search').value = ''
      files.selected = asset
      showPreview(asset)
      return loadFiles()
    })
  }

  // ---------------------------------------------------------------------------
  // The message box: a paperclip, a dropped or pasted file, and voice. A file
  // is stored like any other upload and its attachment text lands in the
  // message being typed. A voice message is transcribed by the proxy
  // (POST <prefix>/api/transcribe) and goes as text, with the recording kept
  // as a file the agent can open.
  // ---------------------------------------------------------------------------

  var VOICE_MAX_SECONDS = 5 * 60
  var VOICE_MARKER = '\uD83C\uDFA4 voice: '
  var voice = { available: false, recorder: null, stream: null, chunks: [], timer: null, startedAt: 0, send: false }

  function composerStatus(text, isError) {
    var status = $('composer-status')
    status.textContent = text
    status.className = 'composer-status' + (isError ? ' failed' : '')
  }

  function composerBusy(text) {
    composerStatus(text)
    $('composer-status').classList.add('busy')
  }

  // Send shows for a message with text; the microphone takes its place while
  // the box is empty, like Telegram.
  function updateComposer() {
    var empty = !$('input').value.trim()
    var busy = state.sending || state.uploading > 0
    var micShown = voice.available && empty
    $('mic').hidden = !micShown
    $('send').hidden = micShown
    $('mic').disabled = busy
    $('send').disabled = busy
    $('attach-file').disabled = state.uploading > 0
  }

  function attachToComposer(file) {
    state.uploading++
    updateComposer()
    var report = function (text, isError) { if (isError) composerStatus(text, true); else composerBusy(text) }
    return storeFile(file, report).then(function (asset) {
      if (asset) { composerStatus(''); attach(asset) }
      return asset
    }).finally(function () {
      state.uploading--
      updateComposer()
    })
  }

  function voiceMimeType() {
    if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return ''
    return ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm', 'audio/ogg']
      .find(function (type) { return MediaRecorder.isTypeSupported(type) }) || ''
  }

  // The proxy answers 501 when the agent has no speech to text; then there is no microphone.
  function probeVoice() {
    if (!voiceMimeType()) return
    chatFetch('/api/transcribe').then(function () {
      voice.available = true
      updateComposer()
    }).catch(function () {})
  }

  function showRecorder(on) {
    $('recorder').hidden = !on
    $('composer').hidden = on
  }

  function startRecording() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var recorder = new MediaRecorder(stream, { mimeType: voiceMimeType() })
      voice.recorder = recorder
      voice.stream = stream
      voice.chunks = []
      voice.send = false
      recorder.addEventListener('dataavailable', function (e) { if (e.data.size) voice.chunks.push(e.data) })
      recorder.addEventListener('stop', finishRecording)
      recorder.start()
      voice.startedAt = Date.now()
      voice.timer = setInterval(tickRecording, 250)
      composerStatus('')
      tickRecording()
      showRecorder(true)
    }).catch(function () {
      composerStatus(t('micDenied'), true)
    })
  }

  function tickRecording() {
    var seconds = Math.floor((Date.now() - voice.startedAt) / 1000)
    $('rec-time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0')
    if (seconds >= VOICE_MAX_SECONDS) stopRecording(true)
  }

  function stopRecording(send) {
    if (!voice.recorder || voice.recorder.state === 'inactive') return
    voice.send = send
    voice.recorder.stop()
  }

  function finishRecording() {
    clearInterval(voice.timer)
    voice.stream.getTracks().forEach(function (track) { track.stop() })
    showRecorder(false)
    if (!voice.send) return
    var type = voice.recorder.mimeType.split(';')[0]
    var blob = new Blob(voice.chunks, { type: type })
    sendVoice(blob, type.includes('ogg') ? 'ogg' : 'webm')
  }

  function transcribe(blob, fileName) {
    var form = new FormData()
    form.append('audio', blob, fileName)
    return chatJSON('/api/transcribe', { method: 'POST', body: form }).then(function (body) { return String(body.text || '').trim() })
  }

  function sendVoice(blob, ext) {
    if (blob.size > MAX_UPLOAD_BYTES) {
      composerStatus(t('voiceTooBig', formatSize(blob.size), formatSize(MAX_UPLOAD_BYTES)), true)
      return
    }
    var fileName = 'voice-' + new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '') + '.' + ext
    var file = new File([blob], fileName, { type: blob.type })
    state.uploading++
    updateComposer()
    composerBusy(t('transcribing'))
    var errorsOnly = function (text, isError) { if (isError) composerStatus(text, true) }
    Promise.all([
      transcribe(blob, fileName),
      DATA.isAdmin ? storeFile(file, errorsOnly) : Promise.resolve(null),
    ]).then(function ([text, asset]) {
      if (!text) { composerStatus(t('voiceEmpty'), true); return null }
      if (!$('composer-status').classList.contains('failed')) composerStatus('')
      return VOICE_MARKER + text + (asset ? '\n' + attachmentText(asset) : '')
    }).catch(function (err) {
      composerStatus(t('voiceFailed', err.message), true)
      return null
    }).then(function (message) {
      state.uploading--
      updateComposer()
      if (message) send(message)
    })
  }

  // ---------------------------------------------------------------------------
  // Wiring.
  // ---------------------------------------------------------------------------

  // Narrow screens: "chat" is the screen; "sessions" and "files" slide over it.
  function setTab(tab) {
    $('app').dataset.tab = tab
  }

  function growInput() {
    var input = $('input')
    input.style.height = 'auto'
    input.style.height = Math.min(input.scrollHeight + 2, window.innerHeight * 0.4) + 'px'
    updateComposer()
  }

  function openFromHash() {
    state.sessionId = decodeURIComponent(location.hash.slice(1)) || null
    loadMessages()
    loadSessions()
  }

  $('open-sessions').addEventListener('click', function () { setTab('sessions') })
  $('open-files').addEventListener('click', function () { setTab('files') })
  $('scrim').addEventListener('click', function () { setTab('chat') })
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { setTab('chat') }) })
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setTab('chat') })
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () { chooseLanguage(b.dataset.lang) })
  })
  $('new-chat').addEventListener('click', newChat)
  $('composer').addEventListener('submit', function (e) { e.preventDefault(); send($('input').value); growInput() })
  $('input').addEventListener('input', growInput)
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); growInput() }
  })

  if (!DATA.isAdmin) $('attach-file').hidden = true
  $('attach-file').addEventListener('click', function () { $('composer-file').click() })
  $('composer-file').addEventListener('change', function (e) {
    if (e.target.files[0]) attachToComposer(e.target.files[0])
    e.target.value = ''
  })
  $('input').addEventListener('paste', function (e) {
    var pasted = e.clipboardData && e.clipboardData.files[0]
    if (!pasted || !DATA.isAdmin) return
    e.preventDefault()
    attachToComposer(pasted)
  })
  var composerBox = $('composer-box')
  composerBox.addEventListener('dragover', function (e) {
    if (!DATA.isAdmin || !Array.from(e.dataTransfer.types).includes('Files')) return
    e.preventDefault()
    composerBox.classList.add('over')
  })
  composerBox.addEventListener('dragleave', function () { composerBox.classList.remove('over') })
  composerBox.addEventListener('drop', function (e) {
    composerBox.classList.remove('over')
    if (!DATA.isAdmin || !e.dataTransfer.files[0]) return
    e.preventDefault()
    attachToComposer(e.dataTransfer.files[0])
  })
  $('mic').addEventListener('click', startRecording)
  $('rec-cancel').addEventListener('click', function () { stopRecording(false) })
  $('rec-send').addEventListener('click', function () { stopRecording(true) })

  var searchTimer
  $('file-search').addEventListener('input', function (e) {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(function () { files.search = e.target.value.trim(); files.offset = 0; loadFiles() }, 250)
  })
  $('file-input').addEventListener('change', function (e) {
    if (e.target.files[0]) uploadFile(e.target.files[0])
    e.target.value = ''
  })
  var drop = $('drop')
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over') })
  drop.addEventListener('dragleave', function () { drop.classList.remove('over') })
  drop.addEventListener('drop', function (e) {
    e.preventDefault()
    drop.classList.remove('over')
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0])
  })

  window.addEventListener('hashchange', openFromHash)
  applyLanguage()
  updateComposer()
  probeVoice()
  openFromHash()
  loadFiles()
})()
</script>
</body>
</html>
