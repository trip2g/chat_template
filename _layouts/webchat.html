<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>

<!--
  webchat – a chat page for a Hermes Agent API server, with a file explorer
  over this site's assets. One file: markup, styles and a vanilla script.
  Read _webchat/README.md before changing it.

  Jet (the template engine) parses this WHOLE file, the script included.
  Never write two opening curly braces in a row, or an opening curly brace
  followed by a star, anywhere below the data block: the page stops rendering.
-->

<script>
  // CHAT API PREFIX – the one setting of this page.
  // A same-origin proxy serves the Hermes Agent API server's /api/sessions…
  // endpoints under this path, e.g. GET /_system/webchatproxy/api/sessions.
  // Change it here if your proxy lives elsewhere. No trailing slash.
  var WEBCHAT_API_PREFIX = '/_system/webchatproxy'
</script>

<script>
  // Theme before first paint, the same rule as the rest of the site: dark
  // unless the sign-in corner's toggle stored $mol_lights = "true".
  try {
    var dark = localStorage.getItem('$mol_lights') !== 'true'
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
  } catch (e) {}
</script>

{{ defaultTemplate.UserSpaceScripts() }}

<style>
  /* Colours. Change these to restyle the whole page. */
  :root, :root[data-theme="light"] {
    --side: #f7f7f7; --main: #ffffff; --raise: #ffffff; --hover: #ececec; --active: #e4e4e4;
    --line: #e5e5e5; --text: #171717; --soft: #5d5d5d; --faint: #8a8a8a;
    --bubble: #f2f2f2; --accent: #2563eb; --accent-soft: #eaf1ff; --danger: #c62828;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 24px rgba(0, 0, 0, .06);
  }
  :root[data-theme="dark"] {
    --side: #171717; --main: #212121; --raise: #2a2a2a; --hover: #262626; --active: #303030;
    --line: #2f2f2f; --text: #ececec; --soft: #b4b4b4; --faint: #8a8a8a;
    --bubble: #2f2f2f; --accent: #7aa7ff; --accent-soft: #1f2a3f; --danger: #ff6b6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* body.webchat, not body: the sign-in corner's stylesheet also colours body. */
  html, body.webchat { margin: 0; height: 100%; background: var(--main); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { opacity: .45; cursor: default; }
  a { color: var(--accent); }
  .sprite { position: absolute; width: 0; height: 0; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--soft); flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn[aria-pressed="true"] { background: var(--active); color: var(--text); }
  .muted { color: var(--faint); font-size: 13px; }
  .error { color: var(--danger); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notice { color: var(--soft); font-size: 14px; }
  .notice a.button { display: flex; width: fit-content; margin-top: 8px; }
  a.button { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line); text-decoration: none; font-size: 14px; font-weight: 500; color: var(--text); }
  a.button.primary { background: var(--text); color: var(--main); border-color: var(--text); }
  .only-phone { display: none !important; }

  /* Three columns: chats | chat | files drawer. The drawer folds away. */
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr) 360px; height: 100vh; }
  .app[data-drawer="closed"] { grid-template-columns: 260px minmax(0, 1fr); }
  .app[data-drawer="closed"] .files { display: none; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .scroll { overflow-y: auto; flex: 1; min-height: 0; }

  /* Chats. The trip2g sign-in corner (and its theme toggle) sits at the foot. */
  .side { background: var(--side); padding: 10px; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; font-weight: 600; min-height: 46px; }
  .brand .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark { width: 26px; height: 26px; border-radius: 50%; background: var(--text); color: var(--main);
    display: grid; place-items: center; flex: none; }
  .mark svg.i { width: 15px; height: 15px; }
  .nav-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px;
    font-size: 14px; text-align: left; }
  .nav-row:hover { background: var(--hover); }
  .sessions { margin: 4px -4px 0; padding: 0 4px; }
  .group { font-size: 12px; font-weight: 500; color: var(--faint); padding: 14px 10px 4px; }
  .session { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 10px; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session:hover { background: var(--hover); }
  .session.active { background: var(--active); font-weight: 500; }
  .sessions .muted, .sessions .error, .sessions .notice { padding: 10px; }
  .signin { border-top: 1px solid var(--line); padding: 8px 4px 0; min-height: 48px; }

  /* Chat. */
  .chat { background: var(--main); }
  .top { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 12px 0 20px; flex: none; }
  .top h1 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .messages { max-width: 780px; margin: 0 auto; padding: 16px 24px 32px; display: flex; flex-direction: column; gap: 26px; }
  .messages > .muted { text-align: center; padding-top: 18vh; font-size: 15px; }
  .msg { overflow-wrap: anywhere; min-width: 0; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .msg.user .body { background: var(--bubble); padding: 10px 16px; border-radius: 20px; max-width: 85%; }
  .msg.assistant .who { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .msg.assistant .tools, .msg.assistant .body, .msg.assistant > .error, .msg.assistant > .notice { margin-left: 36px; }
  .msg p { margin: 0 0 10px; white-space: pre-wrap; }
  .msg ul, .msg ol { margin: 0 0 10px; padding-left: 22px; }
  .msg li { margin: 3px 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg pre { background: var(--bubble); padding: 12px 14px; border-radius: 12px; overflow-x: auto; margin: 0 0 10px; font-size: 13px; }
  code { font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--bubble); padding: 2px 6px; border-radius: 6px; }
  .msg pre code { padding: 0; background: none; }
  .msg img { max-width: 100%; border-radius: 12px; }
  .tools:empty { display: none; }
  .tool { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
  .tool svg.i { width: 15px; height: 15px; color: var(--faint); }
  .att { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; max-width: 85%;
    border: 1px solid var(--line); border-radius: 14px; background: var(--raise); color: var(--text); text-decoration: none; }
  .att b { display: block; font-size: 14px; font-weight: 500; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att .what { min-width: 0; }
  .att .sub { display: block; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* File type badges. */
  .ft { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none;
    font-size: 9px; font-weight: 700; letter-spacing: .02em; color: #fff; background: #6e6e6e; }
  .ft-pdf { background: #e5484d; } .ft-img { background: #8e4ec6; } .ft-media { background: #0d74ce; }
  .ft-text { background: #30a46c; }
  .ft.long { font-size: 7.5px; letter-spacing: 0; }
  .chip .ft.long { font-size: 6.5px; }

  .composer { padding: 0 24px 14px; flex: none; }
  .box { max-width: 780px; margin: 0 auto; background: var(--raise); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow); padding: 8px 8px 8px 14px; }
  .box:focus-within { border-color: color-mix(in srgb, var(--text) 25%, var(--line)); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 2px 0 6px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 4px 4px 4px; border-radius: 10px;
    background: var(--bubble); font-size: 13px; }
  .chip .ft { width: 24px; height: 24px; border-radius: 6px; font-size: 7.5px; }
  .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chip button { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--faint); flex: none; }
  .chip button:hover { background: var(--hover); color: var(--text); }
  .chip svg.i { width: 14px; height: 14px; }
  .box textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; background: none; padding: 6px 2px;
    min-height: 36px; max-height: 40vh; line-height: 1.5; }
  .box textarea::placeholder { color: var(--faint); }
  .row { display: flex; align-items: center; gap: 4px; }
  .row .spacer { flex: 1; }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: var(--main); display: grid; place-items: center; }
  .hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }

  /* Files. */
  .files { background: var(--side); border-left: 1px solid var(--line); }
  .files > header { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 10px 0 18px; flex: none; }
  .files h2 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  .files h2 small { font-size: 13px; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .files-tools { padding: 0 14px 6px; display: flex; flex-direction: column; gap: 8px; }
  .search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 12px;
    background: var(--raise); border: 1px solid var(--line); color: var(--faint); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: 14px; }
  .drop { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px; border: 1.5px dashed var(--line);
    border-radius: 12px; font-size: 13px; color: var(--soft); cursor: pointer; }
  .drop u { color: var(--text); text-underline-offset: 3px; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #file-list { padding: 4px 8px; }
  #file-list > .muted, #file-list > .error { padding: 10px; }
  .file { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 12px; }
  .file:hover { background: var(--hover); }
  .file.active { background: var(--accent-soft); }
  .file > span:last-child { min-width: 0; }
  .file .name { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .muted { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px; }
  .pager:empty { display: none; }
  .pager button { height: 30px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; }
  .preview { border-top: 1px solid var(--line); padding: 14px; max-height: 58%; overflow-y: auto; flex: none; }
  .preview strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .preview .path { font-size: 12px; color: var(--faint); overflow-wrap: anywhere; margin-bottom: 10px; }
  .preview img, .preview video { display: block; max-width: 100%; max-height: 240px; margin: 0 auto 10px; border-radius: 10px; }
  .preview audio { width: 100%; margin-bottom: 10px; }
  .preview iframe { display: block; width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
  .preview pre { background: var(--raise); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; max-height: 240px;
    overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 0 0 10px; }
  .preview .meta { font-size: 12px; color: var(--faint); margin-bottom: 10px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; white-space: nowrap; padding: 0 14px; height: 38px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); text-decoration: none; }
  .actions .btn.primary { background: var(--text); color: var(--main); border-color: var(--text); }

  @media (max-width: 1180px) {
    .app { grid-template-columns: 230px minmax(0, 1fr) 320px; }
    .app[data-drawer="closed"] { grid-template-columns: 230px minmax(0, 1fr); }
  }

  /* Phones: one pane at a time – the menu opens chats, the files button opens files. */
  @media (max-width: 860px) {
    .app, .app[data-drawer="closed"] { grid-template-columns: minmax(0, 1fr); }
    .pane { display: none; }
    .app[data-tab="sessions"] .side, .app[data-tab="chat"] .chat,
    .app[data-tab="files"] .files, .app[data-drawer="closed"][data-tab="files"] .files { display: flex; }
    .only-phone { display: grid !important; }
    .files { border-left: 0; }
    .top { padding: 0 6px; }
    .top h1 { text-align: center; }
    .messages { padding: 8px 16px 24px; gap: 22px; }
    .msg.assistant .tools, .msg.assistant .body, .msg.assistant > .error, .msg.assistant > .notice { margin-left: 0; }
    .msg.user .body, .att { max-width: 92%; }
    .composer { padding: 0 10px 10px; }
    .hint { display: none; }
    .preview { max-height: 50%; }
  }
</style>
</head>

<script type="application/json" id="webchat-data">
  {{ json(map(
    "isAdmin", currentUser.IsAdmin()
  )) }}
</script>

<div class="app" id="app" data-tab="chat">
  <aside class="pane side">
    <div class="brand">
      <span class="mark"><svg class="i"><use href="#i-spark"/></svg></span>
      <span class="name" id="brand-name"></span>
      <button class="icon-btn only-phone" id="close-sessions" title="Back to the chat"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <button class="nav-row" id="new-chat"><svg class="i"><use href="#i-edit"/></svg>New chat</button>
    <div class="scroll sessions" id="session-list"></div>
    <div class="signin"><div mol_view_root="$trip2g_user_space"></div></div>
  </aside>

  <main class="pane chat">
    <header class="top">
      <button class="icon-btn only-phone" id="open-sessions" title="Chats"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="chat-title">Chat</h1>
      <button class="icon-btn only-phone" id="new-chat-top" title="New chat"><svg class="i"><use href="#i-edit"/></svg></button>
      <button class="icon-btn" id="toggle-files" title="Files"><svg class="i"><use href="#i-files"/></svg></button>
    </header>
    <div class="scroll"><div class="messages" id="messages"></div></div>

      <form class="box" id="composer">

        <textarea id="input" rows="1" placeholder="Message"></textarea>

          <span class="spacer"></span>
          <button class="send" id="send" type="submit" title="Send"><svg class="i"><use href="#i-up"/></svg></button>

    </div>
  </main>

  <aside class="pane files">
    <header>
      <h2>Files<small id="file-count"></small></h2>
      <button class="icon-btn" id="close-files" title="Close files"><svg class="i"><use href="#i-x"/></svg></button>
    </header>
    <div class="files-tools">
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input type="search" id="file-search" placeholder="Search files by name or folder"></label>
      <label class="drop" id="drop">
        <svg class="i"><use href="#i-upload"/></svg>Drop a file or <u>choose one</u>
        <input type="file" id="file-input" hidden>
      </label>
      <div class="muted" id="upload-status"></div>
    </div>
    <div class="scroll" id="file-list"></div>
    <div class="pager" id="pager"></div>
    <div class="preview" id="preview" hidden></div>
  </aside>
</div>

<script>
(function () {
  'use strict'

  var DATA = JSON.parse(document.getElementById('webchat-data').textContent)
  var CHAT_API = WEBCHAT_API_PREFIX

  // Where uploaded files go. The folder's hidden note uploads/_files.md embeds
  // every uploaded file: trip2g stores a file only when a note refers to it.
  var UPLOAD_FOLDER = 'uploads'
  var CONTAINER_NOTE = UPLOAD_FOLDER + '/_files.md'

  // trip2g's request body limit (--max-request-body-size, 10 MB by default).
  var MAX_UPLOAD_BYTES = 10 * 1024 * 1024

  // Extensions trip2g accepts as a note's file (internal/image/utils.go).
  var UPLOAD_EXTENSIONS = ('apng avif gif jpg jpeg jfif pjpeg pjp png svg webp ' +
    'mp4 avi mov mkv webm m4v mp3 wav ogg flac m4a aac ' +
    'pdf doc docx xls xlsx ppt pptx txt rtf odt ods odp csv zip rar 7z').split(' ')

  var FILES_PER_PAGE = 50
  var TEXT_PREVIEW_BYTES = 200 * 1024

  // Whether the files drawer is open on a wide screen, remembered per browser.
  var DRAWER_KEY = 'webchat.drawer'

  var $ = function (id) { return document.getElementById(id) }

  // Small DOM helper: el('p', {class: 'x'}, 'text', childNode). Text is always
  // set as text, never as HTML, so nothing from the agent or a file name can
  // inject markup into the page.
  function el(tag, attrs, ...children) {
    var node = document.createElement(tag)
    Object.entries(attrs || {}).forEach(function ([key, value]) {
      if (value === undefined || value === null || value === false) return
      if (key === 'onclick') node.addEventListener('click', value)
      else node.setAttribute(key, value === true ? '' : value)
    })
    children.flat(Infinity).forEach(function (child) {
      if (child === null || child === undefined || child === false) return
      node.append(child instanceof Node ? child : String(child))
    })
    return node
  }

  // An icon from the sprite at the top of <body>.
  function icon(name) {
    var ns = 'http://www.w3.org/2000/svg'
    var svg = document.createElementNS(ns, 'svg')
    svg.setAttribute('class', 'i')
    var use = document.createElementNS(ns, 'use')
    use.setAttribute('href', '#i-' + name)
    svg.append(use)
    return svg
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B'
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB'
    return (bytes / 1024 / 1024).toFixed(1) + ' MB'
  }

  function formatTime(seconds) {
    if (!seconds) return ''
    return new Date(seconds * 1000).toLocaleString()
  }

  // The badge colour of a file: pdf, img, media, text or other.
  function fileKind(contentType, name) {
    var type = contentType || ''
    if (type === 'application/pdf') return 'pdf'
    if (type.startsWith('image/')) return 'img'
    if (type.startsWith('video/') || type.startsWith('audio/') || /\.(mp4|webm|mov|m4v|mkv)$/i.test(name)) return 'media'
    if (type.startsWith('text/') || type.includes('json')) return 'text'
    return 'other'
  }

  function fileBadge(name, contentType) {
    var dot = name.lastIndexOf('.')
    var ext = dot > 0 ? name.slice(dot + 1, dot + 5).toUpperCase() : 'FILE'
    return el('span', { class: 'ft ft-' + fileKind(contentType, name) + (ext.length > 3 ? ' long' : '') }, ext)
  }

  function folderOf(absolutePath) {
    var cut = absolutePath.lastIndexOf('/')
    return cut > 0 ? absolutePath.slice(1, cut) : '/'
  }

  // ---------------------------------------------------------------------------
  // Markdown, safely. Fenced code, inline code, bold, links and images. Links
  // and images only with http(s), a same-site path, or (images) a data:image.
  // ---------------------------------------------------------------------------

  function safeHref(url) {
    if (/^https?:\/\//i.test(url)) return url
    if (url.startsWith('/') && !url.startsWith('//')) return url
    return null
  }

  function safeImageSrc(url) {
    if (/^data:image\/(png|jpe?g|gif|webp);/i.test(url)) return url
    return safeHref(url)
  }

  var INLINE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(!?\[[^\]\n]*\]\([^)\s]+\))|(https?:\/\/[^\s<>()]+)/g

  function renderInline(text) {
    var nodes = []
    var last = 0
    text.replace(INLINE, function (match, code, bold, link, bare, offset) {
      if (offset > last) nodes.push(text.slice(last, offset))
      last = offset + match.length
      if (code) { nodes.push(el('code', null, code.slice(1, -1))); return match }
      if (bold) { nodes.push(el('strong', null, bold.slice(2, -2))); return match }
      if (bare) {
        var href = safeHref(bare)
        nodes.push(href ? el('a', { href: href, target: '_blank', rel: 'noopener' }, bare) : bare)
        return match
      }
      var parts = /^(!?)\[([^\]]*)\]\(([^)]+)\)$/.exec(link)
      if (parts[1]) {
        var src = safeImageSrc(parts[3])
        nodes.push(src ? el('img', { src: src, alt: parts[2] }) : match)
      } else {
        var target = safeHref(parts[3])
        nodes.push(target ? el('a', { href: target, target: '_blank', rel: 'noopener' }, parts[2] || parts[3]) : match)
      }
      return match
    })
    if (last < text.length) nodes.push(text.slice(last))
    return nodes
  }

  // A paragraph whose every line is "- x", "* x" or "1. x" is a list.
  function listNode(lines) {
    var items = lines.split('\n')
    var bullet = /^[-*] /
    var number = /^\d+[.)] /
    var kind = items.every(function (l) { return bullet.test(l) }) ? 'ul'
      : items.every(function (l) { return number.test(l) }) ? 'ol' : null
    if (!kind) return null
    return el(kind, null, items.map(function (l) { return el('li', null, renderInline(l.replace(kind === 'ul' ? bullet : number, ''))) }))
  }

  function renderMarkdown(text) {
    var out = document.createDocumentFragment()
    var blocks = String(text).split(/^```[^\n]*\n?/m)
    blocks.forEach(function (block, i) {
      if (i % 2 === 1) {
        out.append(el('pre', null, el('code', null, block.replace(/\n$/, ''))))
        return
      }
      block.split(/\n{2,}/).forEach(function (para) {
        var lines = para.replace(/^\n+|\n+$/g, '')
        if (!lines.trim()) return
        out.append(listNode(lines) || el('p', null, renderInline(lines)))
      })
    })
    return out
  }

  // Hermes message content is a string, or a list of parts like {type: 'text', text}.
  function contentText(content) {
    if (typeof content === 'string') return content
    if (Array.isArray(content)) {
      return content.map(function (part) {
        if (part.type === 'text') return part.text
        if (part.type === 'image_url') return '![image](' + (part.image_url && part.image_url.url) + ')'
        return ''
      }).join('\n')
    }
    return content ? JSON.stringify(content) : ''
  }

  // ---------------------------------------------------------------------------
  // Chat API: the Hermes Agent API server, reached on this site at CHAT_API
  // through an authenticating proxy. Without a proxy session every call
  // answers 401; the proxy's sign-in page is CHAT_API/oauth2/start?rd=<path>
  // (the oauth2-proxy convention).
  // Formats are Hermes' own: GET /api/sessions -> {data: [session]},
  // GET /api/sessions/{id}/messages -> {data: [message]},
  // POST /api/sessions/{id}/chat/stream -> server-sent events.
  // ---------------------------------------------------------------------------

  function chatFetch(path, options) {
    return fetch(CHAT_API + path, Object.assign({ credentials: 'same-origin' }, options)).then(function (res) {
      var type = res.headers.get('Content-Type') || ''
      if (res.status === 401 || res.redirected || (res.ok && type.includes('text/html'))) {
        var err = new Error('Sign in to the chat to see and send messages.')
        err.signIn = true
        throw err
      }
      // 403: the proxy refused the request (e.g. cross-site); 502: the agent is down;
      // 503: the proxy's sign-in backend is down. Signing in fixes none of them.
      if (res.status === 403 || res.status === 502 || res.status === 503) {
        throw new Error('The chat is not available right now (HTTP ' + res.status + '). Try again in a minute.')
      }
      if (!res.ok) {
        return res.text().then(function (body) { throw new Error('Chat API ' + res.status + ': ' + body.slice(0, 300)) })
      }
      return res
    })
  }

  function chatJSON(path, options) {
    return chatFetch(path, options).then(function (res) { return res.json() })
  }

  var state = { sessionId: null, sending: false, titles: {}, attachments: [] }

  function signInURL() {
    return CHAT_API + '/oauth2/start?rd=' + encodeURIComponent(location.pathname)
  }

  // An error line; for a missing proxy session, a sign-in button with it.
  function errorNode(err) {
    var node = el('div', { class: err.signIn ? 'notice' : 'error' }, err.message)
    if (err.signIn) node.append(' ', el('a', { class: 'button primary', href: signInURL() }, 'Sign in'))
    return node
  }

  function showChatError(err) {
    $('messages').append(errorNode(err))
  }

  // Chats are grouped by when they were last active.
  function sessionGroup(seconds) {
    var now = new Date()
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()
    var then = (seconds || 0) * 1000
    if (then >= today) return 'Today'
    if (then >= today - 6 * 24 * 3600 * 1000) return 'Previous 7 days'
    return 'Earlier'
  }

  // A chat that began with an attached file shows the file's name, not its link;
  // one with nothing said yet is a New chat.
  function sessionLabel(s) {
    return (s.title || s.preview || 'New chat').replace(/\[file: ([^\]\n]*)\](\(\S*\)?)?/g, '$1')
  }

  function loadSessions() {
    var list = $('session-list')
    return chatJSON('/api/sessions?limit=100').then(function (body) {
      list.replaceChildren()
      if (!body.data.length) list.append(el('div', { class: 'muted' }, 'No chats yet.'))
      var group = null
      body.data.forEach(function (s) {
        var label = sessionLabel(s)
        var when = s.last_active || s.started_at
        state.titles[s.id] = label
        if (s.id === state.sessionId) $('chat-title').textContent = label
        if (sessionGroup(when) !== group) {
          group = sessionGroup(when)
          list.append(el('div', { class: 'group' }, group))
        }
        list.append(el('button', {
          class: 'session' + (s.id === state.sessionId ? ' active' : ''),
          title: label + '\n' + (s.source || '') + ' · ' + formatTime(when),
          onclick: function () { location.hash = encodeURIComponent(s.id); setTab('chat') },
        }, label))
      })
    }).catch(function (err) {
      list.replaceChildren(errorNode(err))
    })
  }

  // A file attached to a message (see attachmentText) is drawn as a card.
  var ATTACHMENT = /\[file: ([^\]\n]*)\]\((\S+?)\)\n\(trip2g vault file ([^\n]*)\)\n?/g

  function attachmentCard(name, url, details) {
    var parts = details.split(', ')
    var href = safeHref(url)
    var sub = folderOf(parts[0]) + (parts[2] ? ' · ' + parts[2] : '')
    return el(href ? 'a' : 'div', { class: 'att', href: href, target: href ? '_blank' : null, rel: href ? 'noopener' : null, title: parts[0] },
      fileBadge(name, parts[1]), el('span', { class: 'what' }, el('b', null, name), el('span', { class: 'sub' }, sub)))
  }

  function messageNode(role, text) {
    var body = el('div', { class: 'body' })
    if (role === 'user') {
      var cards = []
      var rest = String(text).replace(ATTACHMENT, function (match, name, url, details) {
        cards.push(attachmentCard(name, url, details))
        return ''
      }).trim()
      if (rest) body.append(renderMarkdown(rest))
      return el('div', { class: 'msg user' }, cards, rest ? body : null)
    }
    body.append(renderMarkdown(text))
    return el('div', { class: 'msg assistant' },
      el('div', { class: 'who' }, el('span', { class: 'mark' }, icon('spark')), 'Assistant'),
      el('div', { class: 'tools' }), body)
  }

  function loadMessages() {
    var box = $('messages')
    box.replaceChildren()
    if (!state.sessionId) {
      $('chat-title').textContent = 'Chat'
      box.append(el('div', { class: 'muted' }, 'Pick a chat on the left or start a new one.'))
      return Promise.resolve()
    }
    $('chat-title').textContent = state.titles[state.sessionId] || state.sessionId
    return chatJSON('/api/sessions/' + encodeURIComponent(state.sessionId) + '/messages').then(function (body) {
      body.data.forEach(function (m) {
        if (m.role !== 'user' && m.role !== 'assistant') return
        var text = contentText(m.content)
        if (text.trim()) box.append(messageNode(m.role, text))
      })
      scrollToEnd()
    }).catch(function (err) { showChatError(err) })
  }

  function scrollToEnd() {
    var scroller = $('messages').parentElement
    scroller.scrollTop = scroller.scrollHeight
  }

  function newChat() {
    return chatJSON('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}',
    }).then(function (body) {
      location.hash = encodeURIComponent(body.session.id)
      setTab('chat')
      return loadSessions()
    }).catch(function (err) { showChatError(err) })
  }

  // Reads a server-sent event stream from a fetch response and calls
  // onEvent(name, data) per event. EventSource cannot POST, hence by hand.
  function readEvents(res, onEvent) {
    var reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
    var buffer = ''
    function pump() {
      return reader.read().then(function (chunk) {
        if (chunk.done) return
        buffer += chunk.value
        var frames = buffer.split('\n\n')
        buffer = frames.pop()
        frames.forEach(function (frame) {
          var name = (frame.match(/^event: (.*)$/m) || [])[1]
          var data = (frame.match(/^data: (.*)$/m) || [])[1]
          if (name && data) onEvent(name, JSON.parse(data))
        })
        return pump()
      })
    }
    return pump()
  }

  // The message as sent: the typed text, then one block per attached file.
  function composedMessage() {
    var parts = [$('input').value.trim()].concat(state.attachments.map(attachmentText))
    return parts.filter(Boolean).join('\n')
  }

  function send() {
    var text = composedMessage()
    if (state.sending || !text) return
    if (!state.sessionId) {
      newChat().then(function () { if (state.sessionId) send() })
      return
    }
    state.sending = true
    $('send').disabled = true
    $('input').value = ''
    fitInput()
    state.attachments = []
    renderChips()

    var box = $('messages')
    if (box.firstChild && box.firstChild.classList.contains('muted')) box.replaceChildren()
    box.append(messageNode('user', text))
    var reply = messageNode('assistant', '')
    var body = reply.querySelector('.body')
    var tools = reply.querySelector('.tools')
    box.append(reply)
    scrollToEnd()

    var answer = ''
    function redraw() { body.replaceChildren(renderMarkdown(answer)); scrollToEnd() }

    // Event names are Hermes': assistant.delta, tool.started, assistant.completed,
    // run.completed, error, done. Anything else is ignored.
    var handlers = {
      'assistant.delta': function (e) { answer += e.delta || ''; redraw() },
      'tool.started': function (e) { tools.append(el('div', { class: 'tool' }, icon('tool'), el('code', null, e.tool_name || '?'))) },
      'assistant.completed': function (e) { if (typeof e.content === 'string' && e.content) answer = e.content; redraw() },
      'error': function (e) { reply.append(el('div', { class: 'error' }, e.message || 'error')) },
    }

    chatFetch('/api/sessions/' + encodeURIComponent(state.sessionId) + '/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
      body: JSON.stringify({ message: text }),
    }).then(function (res) {
      return readEvents(res, function (name, data) { if (handlers[name]) handlers[name](data) })
    }).catch(function (err) {
      reply.append(errorNode(err))
    }).finally(function () {
      state.sending = false
      $('send').disabled = false
      loadSessions()
    })
  }

  // The message box grows with its text, up to 40% of the screen.
  function fitInput() {
    var input = $('input')
    input.style.height = 'auto'
    input.style.height = input.scrollHeight + 'px'
  }

  // ---------------------------------------------------------------------------
  // Files: trip2g's own asset store, through its admin GraphQL on this site.
  // Only the site admin sees this pane; the server refuses everyone else.
  // ---------------------------------------------------------------------------

  function graphql(query, variables) {
    return fetch('/_system/graphql', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, variables: variables }),
    }).then(function (res) { return res.json() }).then(function (body) {
      if (body.errors) throw new Error(body.errors[0].message)
      return body.data
    })
  }

  // A file upload goes as a GraphQL multipart request: operations, map, file.
  function graphqlUpload(query, variables, file) {
    var form = new FormData()
    form.append('operations', JSON.stringify({ query: query, variables: variables }))
    form.append('map', JSON.stringify({ 0: ['variables.input.file'] }))
    form.append('0', file)
    return fetch('/_system/graphql', { method: 'POST', credentials: 'same-origin', body: form })
      .then(function (res) { return res.json() })
      .then(function (body) {
        if (body.errors) throw new Error(body.errors[0].message)
        return body.data
      })
  }

  var LIST_FILES = 'query ($filter: AdminLatestNoteAssetsFilter) { admin { allLatestNoteAssets(filter: $filter) {' +
    ' totalCount nodes { id absolutePath fileName url size createdAt contentType notes { path url } } } } }'

  var READ_NOTE = 'query ($paths: [String!]) { notePaths(filter: { paths: $paths }) { value content latestContentHash } }'

  var PUSH_NOTE = 'mutation ($input: PushNotesInput!) { pushNotes(input: $input) { __typename' +
    ' ... on PushNotesPayload { notes { id path } hashMismatches { path } } ... on ErrorPayload { message } } }'

  var UPLOAD_FILE = 'mutation ($input: UploadNoteAssetInput!) { uploadNoteAsset(input: $input) { __typename' +
    ' ... on UploadNoteAssetPayload { uploadSkipped } ... on ErrorPayload { message } } }'

  var files = { search: '', offset: 0, total: 0, selected: null }

  function loadFiles() {
    if (!DATA.isAdmin) {
      $('file-list').replaceChildren(el('div', { class: 'muted' },
        'Files are for the site admin. Sign in with the button under the chat list.'))
      $('drop').hidden = true
      $('file-search').disabled = true
      $('pick-file').hidden = true
      return Promise.resolve()
    }
    var filter = { search: files.search || null, limit: FILES_PER_PAGE, offset: files.offset }
    return graphql(LIST_FILES, { filter: filter }).then(function (data) {
      var result = data.admin.allLatestNoteAssets
      files.total = result.totalCount
      $('file-count').textContent = result.totalCount
      var list = $('file-list')
      list.replaceChildren()
      if (!result.nodes.length) list.append(el('div', { class: 'muted' }, 'No files.'))
      result.nodes.forEach(function (asset) {
        list.append(el('button', {
          class: 'file' + (files.selected && files.selected.absolutePath === asset.absolutePath ? ' active' : ''),
          title: asset.absolutePath,
          onclick: function () { files.selected = asset; showPreview(asset); loadFiles() },
        }, fileBadge(asset.fileName, asset.contentType),
          el('span', null, el('span', { class: 'name' }, asset.fileName),
            el('span', { class: 'muted' }, folderOf(asset.absolutePath) + ' · ' + formatSize(asset.size)))))
      })
      renderPager()
    }).catch(function (err) {
      $('file-list').replaceChildren(el('div', { class: 'error' }, err.message))
    })
  }

  function renderPager() {
    var pager = $('pager')
    pager.replaceChildren()
    if (files.total <= FILES_PER_PAGE) return
    var page = Math.floor(files.offset / FILES_PER_PAGE) + 1
    var pages = Math.ceil(files.total / FILES_PER_PAGE)
    pager.append(
      el('button', { disabled: page === 1, onclick: function () { files.offset -= FILES_PER_PAGE; loadFiles() } }, 'Back'),
      el('span', { class: 'muted' }, page + ' / ' + pages),
      el('button', { disabled: page === pages, onclick: function () { files.offset += FILES_PER_PAGE; loadFiles() } }, 'Next'))
  }

  function absoluteURL(url) {
    return new URL(url, location.origin).href
  }

  function showPreview(asset) {
    var box = $('preview')
    box.hidden = false
    box.replaceChildren(el('strong', null, asset.fileName), el('div', { class: 'path' }, asset.absolutePath))

    // The type comes from the server's MIME table, which differs between hosts
    // (.webm is audio/webm on some), so video is also recognised by extension.
    var type = asset.contentType
    var isVideo = type.startsWith('video/') || /\.(mp4|webm|mov|m4v|mkv)$/i.test(asset.fileName)
    if (type.startsWith('image/')) box.append(el('img', { src: asset.url, alt: asset.fileName }))
    else if (isVideo) box.append(el('video', { src: asset.url, controls: true, preload: 'metadata' }))
    else if (type.startsWith('audio/')) box.append(el('audio', { src: asset.url, controls: true }))
    else if (type === 'application/pdf') box.append(el('iframe', { src: asset.url, title: asset.fileName }))
    else if (type.startsWith('text/') || type.includes('json')) {
      var pre = el('pre', null, 'Loading…')
      box.append(pre)
      fetch(asset.url, { credentials: 'same-origin', headers: { Range: 'bytes=0-' + (TEXT_PREVIEW_BYTES - 1) } })
        .then(function (res) { return res.text() })
        .then(function (text) { pre.textContent = text })
        .catch(function (err) { pre.textContent = err.message })
    }

    box.append(el('div', { class: 'meta' }, asset.contentType + ' · ' + formatSize(asset.size),
      asset.notes.length ? ' · Used in ' : null,
      asset.notes.map(function (n, i) { return [i ? ', ' : '', el('a', { href: n.url, target: '_blank' }, n.path)] })))

    box.append(el('div', { class: 'actions' },
      el('button', { class: 'btn primary', onclick: function () { attach(asset) } }, icon('clip'), 'Attach to message'),
      el('a', { class: 'btn', href: asset.url, target: '_blank', download: asset.fileName }, icon('download'), 'Download')))
  }

  // What the agent reads: a link it can fetch and where the file sits in the
  // vault it shares with this site.
  function attachmentText(asset) {
    var used = asset.notes.map(function (n) { return n.path }).join(', ')
    return '[file: ' + asset.fileName + '](' + absoluteURL(asset.url) + ')\n' +
      '(trip2g vault file ' + asset.absolutePath + ', ' + asset.contentType + ', ' + formatSize(asset.size) +
      (used ? ', referenced by ' + used : '') + ')'
  }

  // Attached files wait as chips above the message box until it is sent.
  function attach(asset) {
    if (!state.attachments.some(function (a) { return a.absolutePath === asset.absolutePath })) state.attachments.push(asset)
    renderChips()
    setTab('chat')
    $('input').focus()
  }

  function renderChips() {
    var chips = $('chips')
    chips.hidden = !state.attachments.length
    chips.replaceChildren(...state.attachments.map(function (asset) {
      return el('span', { class: 'chip', title: asset.absolutePath },
        fileBadge(asset.fileName, asset.contentType), el('span', { class: 'name' }, asset.fileName),
        el('button', {
          type: 'button',
          title: 'Remove ' + asset.fileName,
          onclick: function () {
            state.attachments = state.attachments.filter(function (a) { return a !== asset })
            renderChips()
          },
        }, icon('x')))
    }))
  }

  // ---------------------------------------------------------------------------
  // Upload: add the file to the hidden note uploads/_files.md, then send the
  // bytes for that note version. That is how trip2g's own sync uploads files.
  // ---------------------------------------------------------------------------

  function uploadStatus(text, isError) {
    var status = $('upload-status')
    status.textContent = text
    status.className = isError ? 'error' : 'muted'
  }

  function sha256Hex(file) {
    return file.arrayBuffer().then(function (buffer) { return crypto.subtle.digest('SHA-256', buffer) }).then(function (digest) {
      return Array.from(new Uint8Array(digest)).map(function (b) { return b.toString(16).padStart(2, '0') }).join('')
    })
  }

  // Characters a wikilink cannot carry become "_"; a taken name gets -2, -3 …
  function freeName(original, taken) {
    var clean = original.replace(/[\[\]|#^\n\r]/g, '_')
    var dot = clean.lastIndexOf('.')
    var stem = dot > 0 ? clean.slice(0, dot) : clean
    var ext = dot > 0 ? clean.slice(dot) : ''
    var name = clean
    for (var n = 2; taken.has(name.toLowerCase()); n++) name = stem + '-' + n + ext
    return name
  }

  function uploadFile(file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase()
    if (!UPLOAD_EXTENSIONS.includes(ext)) {
      uploadStatus('trip2g does not store .' + ext + ' files. Allowed: ' + UPLOAD_EXTENSIONS.join(', '), true)
      return Promise.resolve()
    }
    if (file.size > MAX_UPLOAD_BYTES) {
      uploadStatus(file.name + ' is ' + formatSize(file.size) + '; the limit is ' + formatSize(MAX_UPLOAD_BYTES) + '.', true)
      return Promise.resolve()
    }

    uploadStatus('Uploading ' + file.name + '…')
    var prefix = '/' + UPLOAD_FOLDER + '/'
    var name, versionId

    return Promise.all([
      graphql(READ_NOTE, { paths: [CONTAINER_NOTE] }),
      graphql(LIST_FILES, { filter: { pathPrefix: prefix } }),
      sha256Hex(file),
    ]).then(function ([noteData, listData, hash]) {
      var note = noteData.notePaths[0]
      var taken = new Set(listData.admin.allLatestNoteAssets.nodes.map(function (a) { return a.absolutePath.slice(prefix.length).toLowerCase() }))
      name = freeName(file.name, taken)
      var content = note ? note.content.replace(/\n*$/, '\n') : '---\nfree: false\n---\nFiles uploaded from the chat page.\n'
      var push = {
        updates: [{ path: CONTAINER_NOTE, content: content + '![[' + name + ']]\n', expectedHash: note ? note.latestContentHash : '' }],
      }
      return graphql(PUSH_NOTE, { input: push }).then(function (data) {
        var result = data.pushNotes
        if (result.__typename === 'ErrorPayload') throw new Error(result.message)
        if (result.hashMismatches.length) throw new Error('Someone changed ' + CONTAINER_NOTE + ' at the same time. Try again.')
        // notes lists every note the push touched or re-indexed; take ours.
        versionId = result.notes.find(function (n) { return n.path === CONTAINER_NOTE }).id
        var upload = { file: null, noteId: versionId, sha256Hash: hash, path: name, absolutePath: prefix + name }
        return graphqlUpload(UPLOAD_FILE, { input: upload }, file)
      })
    }).then(function (data) {
      var result = data.uploadNoteAsset
      if (result.__typename === 'ErrorPayload') throw new Error(result.message)
      uploadStatus('Uploaded ' + prefix + name)
      files.search = ''
      files.offset = 0
      $('file-search').value = ''
      return graphql(LIST_FILES, { filter: { pathPrefix: prefix + name, limit: 1 } })
    }).then(function (data) {
      var uploaded = data.admin.allLatestNoteAssets.nodes[0]
      if (uploaded) { files.selected = uploaded; showPreview(uploaded) }
      return loadFiles()
    }).catch(function (err) {
      uploadStatus('Upload failed: ' + err.message, true)
    })
  }

  // ---------------------------------------------------------------------------
  // Wiring. Wide screens show chats, chat and the files drawer side by side;
  // phones show one of them, named by data-tab on #app.
  // ---------------------------------------------------------------------------

  var PHONE = window.matchMedia('(max-width: 860px)')

  function setTab(tab) {
    $('app').dataset.tab = tab
  }

  function setDrawer(open) {
    $('app').dataset.drawer = open ? 'open' : 'closed'
    $('toggle-files').setAttribute('aria-pressed', String(open))
    try { localStorage.setItem(DRAWER_KEY, open ? 'open' : 'closed') } catch (e) {}
  }

  function showFiles() {
    if (PHONE.matches) setTab('files')
    else setDrawer(true)
  }

  function openFromHash() {
    state.sessionId = decodeURIComponent(location.hash.slice(1)) || null
    loadMessages()
    loadSessions()
  }

  var drawerStored = null
  try { drawerStored = localStorage.getItem(DRAWER_KEY) } catch (e) {}
  setDrawer(drawerStored !== 'closed')
  $('brand-name').textContent = document.title

  $('new-chat').addEventListener('click', newChat)
  $('new-chat-top').addEventListener('click', newChat)
  $('open-sessions').addEventListener('click', function () { setTab('sessions') })
  $('close-sessions').addEventListener('click', function () { setTab('chat') })
  $('toggle-files').addEventListener('click', function () {
    if (PHONE.matches) setTab('files')
    else setDrawer($('app').dataset.drawer === 'closed')
  })
  $('close-files').addEventListener('click', function () {
    if (PHONE.matches) setTab('chat')
    else setDrawer(false)
  })
  $('pick-file').addEventListener('click', function () { showFiles(); $('file-search').focus() })
  $('composer').addEventListener('submit', function (e) { e.preventDefault(); send() })
  $('input').addEventListener('input', fitInput)
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send() }
  })

  var searchTimer
  $('file-search').addEventListener('input', function (e) {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(function () { files.search = e.target.value.trim(); files.offset = 0; loadFiles() }, 250)
  })
  $('file-input').addEventListener('change', function (e) {
    if (e.target.files[0]) uploadFile(e.target.files[0])
    e.target.value = ''
  })
  var drop = $('drop')
  drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over') })
  drop.addEventListener('dragleave', function () { drop.classList.remove('over') })
  drop.addEventListener('drop', function (e) {
    e.preventDefault()
    drop.classList.remove('over')
    if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0])
  })

  window.addEventListener('hashchange', openFromHash)
  openFromHash()
  loadFiles()
})()
</script>
</body>
</html>
